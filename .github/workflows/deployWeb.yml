name: Deploy Godot Web

on:
  push:
    branches:
      - main
    tags:
      - "pre-v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.6.3

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Setup Godot
        run: |
          mkdir -p ~/.config
          ln -s /root/.local ~/.local
          ln -s /root/.config/godot ~/.config/godot

      - name: Check Godot version
        run: |
          echo "===== GODOT VERSION ====="
          godot --version
          echo
          echo "===== ENVIRONMENT ====="
          echo "HOME=$HOME"
          echo "USER=$(whoami)"
          echo "GODOT=$(which godot)"

      - name: Download custom Godot Web template
        run: |
          VERSION=$(godot --version | head -n1 | awk '{print $1}')

          echo "Installing custom template for Godot $VERSION"

          mkdir -p "$HOME/.local/share/godot/export_templates/$VERSION"

          wget -O "$HOME/.local/share/godot/export_templates/$VERSION/web_release.zip" \
            https://github.com/FyreDay/godot/releases/download/Paste-Fix/web_release.zip

      - name: Verify templates
        run: |
          echo "===== GODOT TEMPLATE DIRECTORY ====="

          VERSION=$(godot --version | head -n1 | awk '{print $1}')

          echo "Expected version: $VERSION"
          echo

          find "$HOME/.local/share/godot/export_templates" \
            -maxdepth 3 \
            -type f \
            -print 2>/dev/null || true

          echo
          echo "===== ALL WEB TEMPLATES ====="

          find /root /github /home \
            -iname "web_*.zip" \
            -o -iname "web_nothreads*" \
            2>/dev/null || true

          echo
          echo "===== CUSTOM TEMPLATE ====="

          ls -lh \
            "$HOME/.local/share/godot/export_templates/$VERSION/web_release.zip"

          echo
          echo "===== CUSTOM TEMPLATE CONTENTS ====="

          unzip -l \
            "$HOME/.local/share/godot/export_templates/$VERSION/web_release.zip" \
            | head -50

      - name: Export Main
        working-directory: main
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless --verbose \
            --export-release "Web" \
            "$GITHUB_WORKSPACE/build/index.html"

      - name: Checkout tag
        if: startsWith(github.ref, 'refs/tags/pre-v')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: tag

      - name: Export tag to /test
        if: startsWith(github.ref, 'refs/tags/pre-v')
        working-directory: tag
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/test"

          godot --headless --verbose \
            --export-release "Web" \
            "$GITHUB_WORKSPACE/build/test/index.html"

      - name: Cache bust Godot assets
        run: |
          VERSION=${{ github.sha }}

          sed -i \
            -e "s|\.wasm|.wasm?v=$VERSION|g" \
            -e "s|\.pck|.pck?v=$VERSION|g" \
            -e "s|\.js|.js?v=$VERSION|g" \
            "$GITHUB_WORKSPACE/build/index.html"

          if [ -f "$GITHUB_WORKSPACE/build/test/index.html" ]; then
            TAG_VERSION="${{ github.ref_name }}"

            sed -i \
              -e "s|\.wasm|.wasm?v=$TAG_VERSION|g" \
              -e "s|\.pck|.pck?v=$TAG_VERSION|g" \
              -e "s|\.js|.js?v=$TAG_VERSION|g" \
              "$GITHUB_WORKSPACE/build/test/index.html"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/build

  deploy:
    runs-on: ubuntu-24.04
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4